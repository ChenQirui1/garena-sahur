# Keep enough native memory available for Loom and the Minecraft toolchain.
org.gradle.jvmargs=-Xmx384M -Xss512K -XX:MaxMetaspaceSize=192M -XX:ReservedCodeCacheSize=96M -XX:ActiveProcessorCount=4
org.gradle.parallel=false
org.gradle.workers.max=1

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.example

# Dependencies
fabric_api_version=0.92.11+1.20.1
