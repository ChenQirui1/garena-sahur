# Jerome & Richard — owned backend type configuration
#
# `files` is the counterpart of `pytest.ini`'s `testpaths`: bare `mypy` checks exactly the owned
# paths and nothing else, so this file decides the scope and the workflow cannot disagree with it.
# `backend/router` and `backend/telemetry` are Elson & Daniel's and `tests/` is jointly owned;
# checking them here would make a green run claim conformance the team does not have.
#
# `strict` is on because it already held: production and scripts were clean under it before this
# configuration existed, so the profile records what the code does rather than aspiring to it.
[mypy]
python_version = 3.12
strict = True
files = backend/main.py, backend/config.py, backend/ingestion, backend/orchestration, backend/context, backend/models, backend/tests, scripts
