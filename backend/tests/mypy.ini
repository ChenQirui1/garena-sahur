# Jerome & Richard — owned backend type configuration
#
# It sits here rather than at the repository root because mypy auto-discovers a root `mypy.ini`:
# one there would apply this strict profile to every run started from the root, including Elson &
# Daniel's and Ivan's on their own code. Issue #36 records that as a repository-wide decision and
# not ours to take. Passed explicitly instead:
#
#     python -m mypy --config-file backend/tests/mypy.ini
#
# `files` is the counterpart of `pytest.ini`'s `testpaths`: it decides the scope, so the workflow
# cannot disagree with it, and the paths are relative to the directory mypy runs in — the
# repository root, as `pytest.ini`'s are.
# `backend/router` and `backend/telemetry` are Elson & Daniel's, `tests/` is jointly owned, and
# two of the three scripts are theirs; checking any of them here would make a green run claim
# conformance the team does not have — and would eventually go red on a file we cannot fix.
# Our scripts are therefore named one by one, and an owned case fails if the next one is missed.
#
# `strict` is on because it already held: production and scripts were clean under it before this
# configuration existed, so the profile records what the code does rather than aspiring to it.
[mypy]
python_version = 3.12
strict = True
files = backend/main.py, backend/config.py, backend/ingestion, backend/orchestration,
    backend/context, backend/models, backend/tests,
    scripts/run_backend.py, scripts/replay_jsonl.py
