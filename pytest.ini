# Jerome & Richard — owned backend test configuration
#
# This file configures the owned backend suite only. `testpaths` deliberately names just the
# Jerome & Richard packages: `backend/router/tests` is Elson & Daniel's and still scaffolding,
# and `tests/test_end_to_end.py` is the jointly owned integration gate. Keeping them out means
# a green run never implies coverage the team does not have.
#
# `backend/tests` holds the cases for modules at the package root — `backend/config.py` — which
# belong to no sub-package. It is named explicitly rather than collecting `backend`, which would
# sweep in `backend/router/tests`.
[pytest]
testpaths = backend/ingestion backend/orchestration backend/context backend/models backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q
